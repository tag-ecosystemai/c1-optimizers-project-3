name: RunOut backfill (manual)

# One-off / historical jobs. Trigger manually from the Actions tab.
# The news backfill is the important one: GDELT is only reachable from
# GitHub's network, not the local corporate proxy.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [backfill_news, backfill_weather, backfill_portwatch, portwatch_bulk, build_features]
        default: backfill_news
      start:
        description: Start date (YYYY-MM-DD)
        default: '2023-01-01'
      end:
        description: End date (YYYY-MM-DD)
        default: '2026-09-01'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Run task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          case "${{ inputs.task }}" in
            backfill_weather)  python ingestion/backfill.py --weather --start "${{ inputs.start }}" --end "${{ inputs.end }}" ;;
            backfill_news)     python ingestion/backfill.py --news    --start "${{ inputs.start }}" --end "${{ inputs.end }}" ;;
            backfill_portwatch) python ingestion/backfill.py --portwatch ;;
            portwatch_bulk)    python ingestion/portwatch_bulk.py --refresh ;;
            build_features)    python ml/build_port_features.py ;;
          esac
