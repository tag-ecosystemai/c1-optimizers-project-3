name: Seed DataCo Dataset

on:
  workflow_dispatch:
    inputs:
      truncate_first:
        description: 'Truncate existing orders/distributors before seeding'
        type: boolean
        default: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Download DataCo dataset
        run: |
          mkdir -p data/raw
          curl -L -o data/raw/DataCoSupplyChainDataset.csv \
            "https://raw.githubusercontent.com/yybaeza/DataCo.Supply.Chain.Data/master/DataCoSupplyChainDataset.csv" 2>&1
          echo "Size: $(wc -c < data/raw/DataCoSupplyChainDataset.csv) bytes"

      - name: Truncate existing data
        if: inputs.truncate_first
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          import os
          from supabase import create_client
          sb=create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          sb.table('orders').delete().neq('data_co_order_id',0).execute()
          sb.table('distributors').delete().neq('distributor_id',0).execute()
          sb.table('warehouse_inventory').delete().neq('inventory_id',0).execute()
          print('Cleared existing data')
          "

      - name: Run seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATACO_CSV_PATH: data/raw/DataCoSupplyChainDataset.csv
        run: python db/seed_data_co.py